[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# The database URL is supplied by RAG_DATABASE_URL at runtime. Keeping
# credentials out of this file makes the same migration bundle usable by
# local, CI, and deployment tooling.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
