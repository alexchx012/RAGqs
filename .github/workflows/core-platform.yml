name: Core Platform CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAG_DATABASE_URL: postgresql+psycopg://ragqs:ragqs@localhost:5432/ragqs_test
      RAGQS_TEST_POSTGRES_URL: postgresql+psycopg://ragqs:ragqs@localhost:5432/ragqs_test
      # Destructive PG acceptance (random temp schema + real Alembic upgrade +
      # DROP SCHEMA CASCADE) requires an explicit opt-in; database name contains
      # "test" so the safety gate passes.
      RAGQS_ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "1"
      RAGQS_TEST_S3_ENDPOINT: http://localhost:9000
      RAGQS_TEST_S3_ACCESS_KEY: minioadmin
      RAGQS_TEST_S3_SECRET_KEY: minioadmin
      RAGQS_TEST_S3_BUCKET: ragqs-ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ragqs_test
          POSTGRES_USER: ragqs
          POSTGRES_PASSWORD: ragqs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragqs -d ragqs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      minio:
        # Pinned to the same MinIO release docker-compose.yml uses for the
        # Milvus dependency stack; floating latest diverged from it.
        image: minio/minio:RELEASE.2023-03-20T20-16-18Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        command: server /data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --locked --extra dev --extra postgres
      - name: Create object bucket
        run: |
          uv run --locked --extra dev --extra postgres python - <<'PY'
          import boto3
          import time
          client = boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
          )
          for _ in range(30):
              try:
                  client.list_buckets()
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError("MinIO did not become ready")
          client.create_bucket(Bucket="ragqs-ci")
          PY
      - run: uv run --locked --extra dev --extra postgres python -m alembic upgrade head
      - run: uv run --locked --extra dev --extra postgres python -m ruff check app alembic tests
      - run: uv run --locked --extra dev --extra postgres python -m black --check app alembic tests
      - run: uv run --locked --extra dev --extra postgres python -m isort --check-only app alembic tests
      - run: uv run --locked --extra dev --extra postgres python -m mypy app
      - run: uv run --locked --extra dev --extra postgres python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend and verify static/ is up to date
        working-directory: frontend
        # vite build 输出到 ../static/；构建后该目录应与已提交产物完全一致，否则 static/ 已过期。
        run: |
          npm run build
          if [ -n "$(git status --porcelain ../static)" ]; then
            git status --porcelain ../static
            echo "::error::static/ is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi

  frontend-e2e:
    name: Frontend Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright e2e tests
        working-directory: frontend
        run: npm run test:e2e
