name: Design CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  design-contract:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify authoritative design decisions
        shell: bash
        run: |
          set -euo pipefail

          # docs/项目设计/ 按仓库约定仅保存在本地（.git/info/exclude），不进 Git，
          # 因此这里只校验仓库内 tracked 的设计/运维产物。
          required_files=(
            "docs/deployment.md"
            "docs/operations.md"
            "alembic.ini"
            "alembic/env.py"
            "alembic/versions/0001_core_platform_initial.py"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required design artifact: $file"; exit 1; }
          done

          require_text() {
            local file="$1"
            local text="$2"
            grep --fixed-strings --quiet -- "$text" "$file" || {
              echo "Missing design contract in $file: $text"
              exit 1
            }
          }

          deployment="docs/deployment.md"
          operations="docs/operations.md"

          require_text "$operations" "POST /calibration/window"

          require_text "$deployment" "alembic upgrade head"
          require_text "$deployment" "alembic current --check-heads"

  migration-contract:
    name: Migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ragqs_ci
          POSTGRES_USER: ragqs
          POSTGRES_PASSWORD: ragqs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragqs -d ragqs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked migration dependencies
        run: uv sync --locked --extra postgres

      - name: Validate migration source and single head
        run: |
          set -euo pipefail

          uv run --locked --extra postgres python -m compileall -q alembic
          head_file="$(mktemp)"
          trap 'rm -f "$head_file"' EXIT
          uv run --locked --extra postgres alembic heads > "$head_file"
          head_count="$(grep -cv '^[[:space:]]*$' "$head_file" || true)"
          test "$head_count" -eq 1 || {
            echo "expected exactly one Alembic head, found: $head_count"
            cat "$head_file"
            exit 1
          }

      - name: Apply migration to an empty PostgreSQL database
        env:
          RAG_DATABASE_URL: postgresql://ragqs:ragqs@localhost:5432/ragqs_ci
        run: uv run --locked --extra postgres alembic upgrade head

      - name: Verify database migration head
        env:
          RAG_DATABASE_URL: postgresql://ragqs:ragqs@localhost:5432/ragqs_ci
        run: uv run --locked --extra postgres alembic current --check-heads

# New runtime behavior belongs in design-driven contract tests written with each
# reconstructed vertical slice. Do not add legacy tests or builds as substitutes.
