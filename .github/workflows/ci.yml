name: Design CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  design-contract:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify authoritative design decisions
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "docs/项目设计/后端设计.md"
            "docs/项目设计/前端接口需求.md"
            "docs/deployment.md"
            "docs/operations.md"
            "alembic.ini"
            "alembic/env.py"
            "alembic/versions/0001_initial_schema.py"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || { echo "Missing required design artifact: $file"; exit 1; }
          done

          require_text() {
            local file="$1"
            local text="$2"
            grep --fixed-strings --quiet -- "$text" "$file" || {
              echo "Missing design contract in $file: $text"
              exit 1
            }
          }

          backend="docs/项目设计/后端设计.md"
          frontend="docs/项目设计/前端接口需求.md"
          deployment="docs/deployment.md"
          operations="docs/operations.md"

          require_text "$backend" "非流式兼容 JSON 的序列化决策"
          require_text "$backend" "POST /chat"
          require_text "$backend" "answer_mode"
          require_text "$frontend" "POST /chat"
          require_text "$frontend" "answer_mode"

          require_text "$backend" "POST /messages/{id}/ab-vote"
          require_text "$backend" "ab_pair"
          require_text "$backend" "ab_vote"
          require_text "$frontend" "POST /messages/{id}/ab-vote"

          require_text "$backend" "calibration_window"
          require_text "$backend" "GET /calibration/window"
          require_text "$backend" "POST /calibration/window"
          require_text "$frontend" "GET /calibration/window"
          require_text "$frontend" "POST /calibration/window"
          require_text "$operations" "POST /calibration/window"

          require_text "$deployment" "alembic upgrade head"
          require_text "$deployment" "alembic current --check-heads"

  migration-contract:
    name: Migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ragqs_ci
          POSTGRES_USER: ragqs
          POSTGRES_PASSWORD: ragqs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragqs -d ragqs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[postgres]"

      - name: Validate migration source and single head
        run: |
          set -euo pipefail

          python -m compileall -q alembic
          head_file="$(mktemp)"
          trap 'rm -f "$head_file"' EXIT
          alembic heads > "$head_file"
          head_count="$(grep -cv '^[[:space:]]*$' "$head_file" || true)"
          test "$head_count" -eq 1 || {
            echo "expected exactly one Alembic head, found: $head_count"
            cat "$head_file"
            exit 1
          }

      - name: Apply migration to an empty PostgreSQL database
        env:
          RAGQS_DATABASE_URL: postgresql://ragqs:ragqs@localhost:5432/ragqs_ci
        run: alembic upgrade head

      - name: Verify database migration head
        env:
          RAGQS_DATABASE_URL: postgresql://ragqs:ragqs@localhost:5432/ragqs_ci
        run: alembic current --check-heads

# New runtime behavior belongs in design-driven contract tests written with each
# reconstructed vertical slice. Do not add legacy tests or builds as substitutes.
