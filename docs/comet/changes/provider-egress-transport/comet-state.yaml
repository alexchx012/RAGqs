      truncated: false
  - id: A11
    source: specs/provider-egress/spec.md
    text: 熔断拒绝与 deadline 前置拒绝不产生 usage 事件。
    result: passed
    reason:
      text: 熔断与 deadline 前置拒绝都发生在 usage prepare 之前，0 usage 事件有测试断言
      truncated: false
  - id: A12
    source: specs/provider-egress/spec.md
    text: 生成 provider：`DASHSCOPE_API_KEY`（或全局 provider 配置）就绪时 runtime 装配 DashScope
      chat adapter（ChatProviderPort 生产实现，含流式语义）；未配置时保持
      UnavailableChatProviderPort（dev/test 503 fail-closed）。
    result: passed
    reason:
      text: 同 A4：DashScopeChatProvider 生产装配，未配置 fail-closed；流式语义由 worker 消费链保持
      truncated: false
  - id: A13
    source: specs/provider-egress/spec.md
    text: ProviderReconciliationPort：生产实现提供 provider
      侧结果确认查询（completed/not_sent/unknown 判定），供 usage unknown 对账与 chat 恢复流调用。
    result: passed
    reason:
      text: LedgerBackedProviderReconciliationPort 三态判定，注册 runtime
        provider_reconciliation_port，只读契约遵守
      truncated: false
  - id: A14
    source: specs/provider-egress/spec.md
    text: usage 集成：`run_provider_call_with_usage` 是生产 provider
      调用唯一包装（prepared→dispatching→completed/not_sent/unknown 生命周期）；embedding 自记
      usage 逻辑并入，不存在平行记账。
    result: passed
    reason:
      text: embedding 手写生命周期 0 残留，统一经
        run_provider_call_with_usage+UsageSubmissionLifecycle；judge 同构收口
      truncated: false
