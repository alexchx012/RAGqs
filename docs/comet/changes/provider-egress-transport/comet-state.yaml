    source: specs/provider-egress/spec.md
    text: 调用继承绝对 deadline；首次出站与每次短重试各分配唯一 `provider_call_id`。
    result: passed
    reason:
      text: deadline 由调用方传入 ProviderCallContext；attempt deadline=min(绝对,30s
        cap)；内核测试既有覆盖
      truncated: false
