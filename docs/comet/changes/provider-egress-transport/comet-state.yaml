    source: specs/provider-egress/spec.md
    text: 重试策略：429/502/503/504/网络错误可重试，确定性 4xx 不重试；同步 ≤3 次、异步入库 ≤5 次；退避
      250ms/1s/4s/16s+抖动、单次 ≤30s；HTTP 客户端关闭隐式自动重试。
    result: passed
    reason:
      text: 429/502/503/504 可重试、确定性 4xx 不重试；RetryPolicy 3/5、退避(0.25,1,4,16) cap
        30s；test_deterministic_4xx_is_not_retried 通过
      truncated: false
  - id: A10
    source: specs/provider-egress/spec.md
    text: 熔断按 provider+operation 隔离：连续 5 次可重试失败 open 60s、half-open 单探测；判官与图片 VLM/生成
      lane 互不借用容量；状态进指标与结构化日志。
    result: passed
    reason:
      text: CircuitBreakerRegistry 按 (provider,operation) 键隔离，judge/chat/embedding
