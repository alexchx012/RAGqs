  - id: A1
    source: brief.md
    text: "A1: 能力层（indexing/chat/evaluation/agents）不再出现直接构造模型 HTTP 请求的 `httpx.`
      调用（唯一白名单：platform 层 transport 构造），以契约测试/静态检查断言。"
    result: passed
    reason:
      text: 静态守卫测试扫描四域源码 0 残留 httpx
        构造；白名单=model_http.py+检索后端；test_capability_layer_has_no_direct_model_http_calls
        通过
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 每个收口点在超时/429/503 场景下呈现 §2.9 行为：同步 ≤3 次、异步入库 ≤5 次、退避
      250ms/1s/4s/16s+抖动单次 ≤30s、熔断连续 5 次 open 60s half-open 单探测（假 transport
      断言调用序列）。"
    result: passed
    reason:
      text: 同步预算3+退避序列断言、熔断15次物理发送后open、half-open单探测全部有测试；embedding 异步路径
        asynchronous=True
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 每次物理发送产生新 `provider_call_id`；熔断拒绝/deadline 前置拒绝不产生 usage 事件。"
    result: passed
    reason:
      text: 每次物理发送唯一 pc_ 前缀 id；熔断拒绝 0 usage
        事件；test_each_physical_send_gets_distinct_provider_call_id 通过
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 配置 DASHSCOPE_API_KEY 后 runtime 装配 DashScope chat adapter；ask→生成→SSE
      全链经生产 transport（假 transport 契约测试 + 真实配置手动 smoke）；未配置时 dev/test
      行为不变（Unavailable 503）。"
    result: passed
    reason:
      text: 装配双分支测试：api_key 就绪→DashScopeChatProvider；未配置→Unavailable 503；真实 smoke
        无凭证列入 known_limits
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: ProviderReconciliationPort 生产实现可确认 completed/not_sent/unknown（假
      transport 契约测试）；现有各域测试全绿（embedding_failed、contextual unavailable 等行为码稳定）。"
    result: passed
    reason:
      text: 对账五分支契约测试通过；tests/usage 全绿（1 个环境预存在失败与本 change 无关，git stash 双向验证）
      truncated: false
  - id: A6
    source: specs/provider-egress/spec.md
    text: "`platform.provider` 是唯一出网点：embedding、contextual retrieval、图片
      VLM、prompt-enhance、评测判官、chat 生成全部经统一 transport 内核出网；能力层不得直接构造模型 HTTP
      请求（契约测试守卫）。"
    result: passed
    reason:
      text: 五直连点+chat adapter 全部经 model_http_post/ModelHttpTransport 出网，与 A1 静态证据互证
      truncated: false
