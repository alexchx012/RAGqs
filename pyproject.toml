[project]
name = "ragqs-core-platform"
version = "0.1.0"
description = "Versioned backend core platform for RAGqs"
authors = [{ name = "RAGqs" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.16.0",
    "boto3>=1.34.0",
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.1"]
dev = [
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.9",
]

[project.scripts]
ragqs-identity-bootstrap-admin = "app.identity.bootstrap:main"
ragqs-identity-deletion-worker = "app.identity.worker:main"
ragqs-outbox-worker = "app.outbox.worker:main"
ragqs-outbox-retirement-worker = "app.outbox.retirement_worker:main"
ragqs-outbox-compaction-worker = "app.outbox.compaction_worker:main"
ragqs-usage-maintenance = "app.usage.maintenance:main"
ragqs-evaluation-maintenance = "app.evaluation.maintenance:main"
ragqs-retention-maintenance = "app.retention.worker:main"
ragqs-chat-maintenance = "app.chat.maintenance:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", ".venv", "venv", "logs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["alembic", "app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["alembic", "app"]
src_paths = ["app", "tests"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "-q", "--strict-markers", "--cov=app"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires configured PostgreSQL and S3-compatible object storage"]
